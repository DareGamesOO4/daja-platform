<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAJA Studio</title>
  <link rel="stylesheet" href="/panel.css">
  <script type="module" src="/panel.js"></script>
</head>
<body>
  <main>
    <header><div><h1>DAJA Studio</h1><p>Lokalna proba i stanje obrade</p></div></header>
    <div class="workspace">
      <section>
        <h2>Lokalna proba</h2>
        <p>Obradi sliku na ovom računaru i preuzmi četiri verzije.</p>
        <form id="trial" class="actions">
          <input type="file" id="source" aria-label="Originalna fotografija" accept="image/*" required>
          <button class="primary">Obradi sliku</button>
        </form>
        <p id="trial-status" role="status"></p>
        <ul id="results"></ul>
      </section>
      <section>
        <h2>Status</h2>
        <p id="worker" role="status">DAJA računar · povezivanje…</p>
        <p id="render" role="status">Render · proveravam…</p>
        <p id="linkel" role="status">Linkel · proveravam…</p>
        <p>Podešavanja i red slika su u DAJA adminu, u odeljku Slike.</p>
      </section>
    </div>
  </main>
</body>
</html>
