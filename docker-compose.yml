services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: daja_platform
      POSTGRES_USER: daja_app
      POSTGRES_PASSWORD: daja_app_password
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daja_app -d daja_platform']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
