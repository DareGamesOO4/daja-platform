name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: daja_platform
          POSTGRES_USER: daja_app
          POSTGRES_PASSWORD: daja_app_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daja_app -d daja_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgres://daja_app:daja_app_password@localhost:5432/daja_platform
      REDIS_URL: redis://localhost:6379
      API_PUBLIC_BASE_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      LOG_LEVEL: silent
      DB_STATEMENT_TIMEOUT_MS: 5000
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: 10000
      DB_POOL_MAX: 10
      DB_SLOW_QUERY_MS: 250
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npm run openapi:check
      - run: npm run check:no-demo
      - run: npm run security:deps
      - run: docker build -f apps/api/Dockerfile -t daja-api:ci .
      - run: docker build -f apps/worker/Dockerfile -t daja-worker:ci .
